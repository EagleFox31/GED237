server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets can be cached aggressively because Vite fingerprints them.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
