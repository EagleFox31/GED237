
<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="%BASE_URL%icon-small.png">
    <title>E-Dossier Cameroun | GED Premium</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .animate-flow {
            animation: flow 15s ease-in-out infinite;
        }
        @keyframes flow {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        /* Soft scroll styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>
<script nomodule>
    // Navigateur trop ancien pour lancer l'application (sans modules JavaScript) : on remplace la
    // page blanche par un message. Doit tourner sous IE 8 (navigateur livré avec Windows 7) :
    // getElementById et innerHTML seulement, styles en px.
    document.getElementById('root').innerHTML =
        '<div style="max-width:512px;margin:64px auto;padding:24px;font-family:Arial,sans-serif;' +
        'border:1px solid #cbd5e1;border-radius:16px;background:#fff;color:#0f172a;text-align:center">' +
        '<p style="font-size:18px;font-weight:bold;margin:0 0 12px">Ce navigateur est trop ancien pour E-Dossier.</p>' +
        '<p style="margin:0">Ouvrez cette page dans Chrome, Edge ou Firefox.</p></div>';
</script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
