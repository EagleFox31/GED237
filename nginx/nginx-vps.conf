# VPS overlay (docker-compose.vps.yml): the frontend is the production nginx image on port 80.
# Everything else is shared with nginx.conf through app-locations.conf.
# Upgrade WebSocket seulement si le client le demande (sinon "close", comme nginx par défaut).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
