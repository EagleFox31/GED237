# VPS overlay (docker-compose.vps.yml): the frontend is the production nginx image on port 80.
# Everything else is shared with nginx.conf through app-locations.conf.
# Upgrade WebSocket seulement si le client le demande (sinon "close", comme nginx par défaut).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Security headers (#252). The compiled frontend only loads its own files: one inline
# <style> in index.html and the docx/xlsx previews need 'unsafe-inline' for styles,
# previews and exports use blob: URLs, notifications use a same-origin WebSocket.
# Swagger and ReDoc load a CDN and an inline script: no CSP on those two pages.
map $uri $ged_csp_default {
    ~^/api/(docs|redoc)(/|$) "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# A header the API already sends wins (the document stream sets a stricter CSP and
# Referrer-Policy no-referrer): nginx skips add_header when the value is empty.
map $upstream_http_content_security_policy $ged_csp {
    ""      $ged_csp_default;
    default "";
}
map $upstream_http_referrer_policy $ged_referrer_policy {
    ""      same-origin;
    default "";
}
map $upstream_http_x_content_type_options $ged_nosniff {
    ""      nosniff;
    default "";
}
map $upstream_http_x_frame_options $ged_frame_options {
    ""      DENY;
    default "";
}

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Inherited by every location of app-locations.conf (none sets its own add_header).
    # No HSTS: the VPS serves plain HTTP behind the VPN; HSTS goes with public TLS (#154, #212).
    add_header Content-Security-Policy $ged_csp always;
    add_header Referrer-Policy $ged_referrer_policy always;
    add_header X-Content-Type-Options $ged_nosniff always;
    add_header X-Frame-Options $ged_frame_options always;

    include /etc/nginx/snippets/app-locations.conf;
}
