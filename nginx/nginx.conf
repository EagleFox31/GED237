# Upgrade WebSocket seulement si le client le demande (sinon "close", comme nginx par défaut).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Journal d'accès sans le ticket du canal de notifications (?ticket=...) : format
# « combined » de nginx, requête masquée. Utilisé par app-locations.conf.
map $request $request_masked {
    "~^(?<req_head>.*[?&]ticket=)[^&\s]+(?<req_tail>.*)$" "${req_head}[masked]${req_tail}";
    default $request;
}
log_format masked '$remote_addr - $remote_user [$time_local] "$request_masked" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
