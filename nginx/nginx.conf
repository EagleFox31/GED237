# Upgrade WebSocket seulement si le client le demande (sinon "close", comme nginx par défaut).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# DNS interne de Docker, relu toutes les 10 s : api ou frontend recréé (sauvegarde,
# restauration, mise à jour) change d'adresse IP ; sans cela nginx garde l'ancienne et répond 502.
# `resolve` exige nginx 1.27.3 ou plus (image fixée dans les fichiers compose).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

upstream frontend_app {
    zone frontend_app 64k;
    server frontend:5173 resolve;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app-locations.conf;
}
