# Upgrade WebSocket seulement si le client le demande (sinon "close", comme nginx par défaut).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Journal d'accès sans secret : ni le jeton d'un lien « Ouvrir »
# (/documents/stream/<jeton>) ni la query string (notifications/ws?token=...)
# ne sont écrits. Appliqué par app-locations.conf (access_log ... ged_masked).
map $uri $ged_log_path {
    "~^(?<ged_stream>.*/documents/stream/)" "${ged_stream}***";
    default $uri;
}
map $http_referer $ged_log_referer {
    "~^(?<ged_ref_stream>[^?#]*/documents/stream/)" "${ged_ref_stream}***";
    "~^(?<ged_ref_base>[^?#]*)[?#]" $ged_ref_base;
    default $http_referer;
}
log_format ged_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $ged_log_path $server_protocol" '
                      '$status $body_bytes_sent "$ged_log_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:5173;
}

server {
    listen 443 ssl;
    server_name _;

    # Certificat local généré sur le poste (mkcert), monté depuis TLS_CERT_DIR : jamais dans le dépôt.
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/app-locations.conf;
}
