# Scheduled backup (post-rc1 lot 13), off unless this overlay is added:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d api worker
# api and worker both: the worker's beat writes the backups, the api reports
# their status and the "stale" alert. Other settings (hour, retention, maximum
# age, pg_dump) are passed by docker-compose.yml, from .env.
# The worker writes one backup a night into ./backups/scheduled (host), same
# layout as ops/backup.sh. Keep it apart from ops/backup.sh's BACKUP_DIR:
# that script's BACKUP_RETENTION counts every ged237-* directory it finds.
# Requires a pg_dump of the server's major version (checked before each run):
# set SCHEDULED_BACKUP_PG_DUMP once postgresql-client-15 is in the worker image.
services:
  worker:
    environment:
      SCHEDULED_BACKUP_ENABLED: "true"
    volumes:
      - ${SCHEDULED_BACKUP_HOST_DIR:-./backups/scheduled}:/var/backups/ged237
  api:
    environment:
      SCHEDULED_BACKUP_ENABLED: "true"
