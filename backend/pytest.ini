[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/workers/*
    app/core/ocr/*
    alembic/*

[coverage:report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__
    if TYPE_CHECKING
