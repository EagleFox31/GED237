# backend/app/core/authz/model.conf
#
# Modèle RBAC simple pour GED237.
# sub  = rôle utilisateur (ex. "tenant_admin")
# obj  = ressource métier (ex. "documents", "categories")
# act  = action normalisée (ex. "read", "create", "manage")
#
# La correspondance "manage" → toutes actions se fait dans la façade Python,
# pas ici. Casbin valide uniquement la permission déclarée dans policy.csv.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && (r.act == p.act || p.act == "manage")
