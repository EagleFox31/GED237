name: edossier-e2e

# Self-contained E2E stack: same command locally and in CI.
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
#   docker compose -f docker-compose.e2e.yml down -v
# Override the Playwright selection with E2E_ARGS (default: the smoke project).
# Reports land in frontend/e2e-out/ (git-ignored).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  postgres:
    image: postgres:15-alpine
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    shm_size: 128m
    logging: *default-logging
    environment:
      POSTGRES_DB: edossier_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    # Throwaway data: every run starts from an empty database.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d edossier_e2e"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    logging: *default-logging
    # e2e_reset.sh: seed_db.py builds the schema from the models (as the pytest suite does) and loads
    # the demo accounts, then seed_e2e.py loads frontend/e2e/data/seed-manifest.json (categories,
    # classification plan, E2E-WF-VALID circuit, documents in known states). `stamp head` then records
    # the schema as fully migrated. Migrations are not replayed here: the backend gate already runs
    # `alembic upgrade head` + `check`.
    command: >-
      sh -c "sh scripts/e2e_reset.sh e2e
      && alembic stamp head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./frontend/e2e/data:/e2e-data:ro
      # Server-side folder for POST /documents/ingest-directory (SC-ADM-08). Same container path as
      # docker-compose.yml (only the host corpus differs); INGEST_ALLOWED_ROOTS points to it.
      - ./frontend/e2e/data/demo-import:/data/ingest:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres:5432/edossier_e2e
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: e2e-only-not-a-secret
      STORAGE_PATH: /tmp/ged-storage
      # The browser runs in the e2e container and serves the app from 127.0.0.1:5173.
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      # development echoes the OTP in the login response; the specs rely on it.
      ENVIRONMENT: development
      E2E_MANIFEST: /e2e-data/seed-manifest.json
      # Directory imports are refused outside these roots (403 INGEST_PATH_FORBIDDEN when empty).
      INGEST_ALLOWED_ROOTS: /data/ingest
      # The suite logs in once per test and retries on CI: keep auth rate limits above that pace.
      AUTH_LOGIN_RATE_LIMIT: 30/minute
      AUTH_OTP_RATE_LIMIT: 30/minute
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      # Covers both seeds before uvicorn listens.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  e2e:
    # Keep the tag in step with @playwright/test in frontend/package-lock.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    shm_size: 1g
    logging: *default-logging
    working_dir: /app
    environment:
      CI: "true"
      HUSKY: "0"
      VITE_API_URL: http://api:8000/api/v1
      PLAYWRIGHT_HTML_OUTPUT_DIR: /out/playwright-report
      E2E_ARGS: ${E2E_ARGS:---project=smoke}
    volumes:
      # Sources read-only, copied into the container: host node_modules (Windows) never leak in.
      - ./frontend:/src:ro
      - ./frontend/e2e-out:/out
    command: >-
      bash -c "tar -C /src --exclude=./node_modules --exclude=./dist --exclude=./e2e-out
      --exclude=./playwright-report --exclude=./test-results --exclude=./.auth -cf - . | tar -xf -
      && npm ci --no-audit --no-fund --loglevel=error
      && npx playwright test $$E2E_ARGS --output=/out/test-results"
    depends_on:
      api:
        condition: service_healthy
