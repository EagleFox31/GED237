name: ${LOAD_COMPOSE_PROJECT:-ged-load}

# Volume test stack (item 8, 100 000 documents). Driven by scripts/load-test.sh, never `up` by hand.
# Isolated project, own volumes, nothing published on the host. Budget: 3 GB and 4 CPUs in total
# while the measure runs (postgres 704m + redis 128m + api 1g + worker 1g + probe 160m).
# Corpus and storage live in Docker volumes, not on a host folder (disk of C: is short).
#   bash scripts/load-test.sh calibrate        # 2 000 files, then projection on 100 000
#   bash scripts/load-test.sh down             # remove containers and volumes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://load:load@postgres:5432/edossier_load
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SECRET_KEY: load-test-only-not-a-secret
  STORAGE_PATH: /var/storage_data
  INGEST_ALLOWED_ROOTS: /data/ingest
  # development echoes the OTP in the login response: the probe logs in without a mailbox.
  ENVIRONMENT: development
  APP_VERSION: ${APP_VERSION:-0.0.0-dev}
  AUTH_LOGIN_RATE_LIMIT: 300/minute
  AUTH_OTP_RATE_LIMIT: 300/minute

services:
  postgres:
    image: postgres:15-alpine
    # LOAD_PG_* / LOAD_REDIS_CPUS / LOAD_*_MEM / LOAD_API_WORKERS: wide-envelope run only (PO, 19/11);
    # the defaults stay the envelope of the shipped-setting runs.
    mem_limit: ${LOAD_PG_MEM:-704m}
    memswap_limit: ${LOAD_PG_MEM:-704m}
    cpus: ${LOAD_PG_CPUS:-1.0}
    shm_size: 128m
    logging: *default-logging
    environment:
      POSTGRES_DB: edossier_load
      POSTGRES_USER: load
      POSTGRES_PASSWORD: load
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load -d edossier_load"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    memswap_limit: 128m
    cpus: ${LOAD_REDIS_CPUS:-0.25}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    mem_limit: ${LOAD_API_MEM:-1g}
    memswap_limit: ${LOAD_API_MEM:-1g}
    # Default = the setting the app ships with. LOAD_API_CPUS / LOAD_WORKER_CPUS /
    # LOAD_WORKER_CONCURRENCY serve the tuning runs (api + worker <= 2.5 CPUs) and the wide-envelope run.
    cpus: ${LOAD_API_CPUS:-1.25}
    logging: *default-logging
    # No --reload and no proxy: the probe calls this port directly (a proxy read timeout would cut
    # a synchronous ingest of 10 000 files). One process by default: one process uses one core at most.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${LOAD_API_WORKERS:-1}
    volumes:
      - storage_data:/var/storage_data
      - corpus:/data/ingest:ro
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Text PDF only: native extraction, no OCR model is loaded. No beat (-B): no watched folder.
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=${LOAD_WORKER_CONCURRENCY:-2}
    mem_limit: ${LOAD_WORKER_MEM:-1g}
    memswap_limit: ${LOAD_WORKER_MEM:-1g}
    cpus: ${LOAD_WORKER_CPUS:-1.25}
    logging: *default-logging
    volumes:
      - storage_data:/var/storage_data
    environment:
      <<: *backend-env
      OCR_FALLBACK_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off jobs before the measure (corpus, migrations, demo baseline): api and worker are not up yet.
  tools:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging: *default-logging
    volumes:
      - storage_data:/var/storage_data
      - corpus:/data/ingest
      - ./frontend/e2e/data:/e2e-data:ro
    environment:
      <<: *backend-env
      E2E_MANIFEST: /e2e-data/demo-manifest.json
      DEMO_CORPUS: /data/ingest/demo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Chronometer during the measure: HTTP to the api port, reads of postgres and of the queue.
  probe:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.25
    logging: *default-logging
    volumes:
      - corpus:/data/ingest:ro
      - ./gestion-projet/recette:/results
    environment:
      <<: *backend-env
      MEASURE_PASSWORD: ${MEASURE_PASSWORD:-Minfi@2025}
      LOAD_GIT_SHA: ${LOAD_GIT_SHA:-unknown}

volumes:
  pg_data:
  storage_data:
  corpus:
