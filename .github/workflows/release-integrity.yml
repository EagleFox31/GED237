name: Release Integrity (T6.5)

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  sbom-and-signature:
    name: SBOM + Manifest + GPG signature
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The secrets context is not allowed in step-level `if:`; expose a flag instead.
    env:
      HAS_GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' && secrets.RELEASE_GPG_PASSPHRASE != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install SBOM tooling
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          npm ci --prefix frontend

      - name: Generate backend CycloneDX SBOM
        run: |
          mkdir -p sbom
          cyclonedx-py requirements backend/requirements.txt \
            --output-format JSON \
            --output-file sbom/backend-cyclonedx.json

      - name: Generate frontend CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --output-file sbom/frontend-cyclonedx.json \
            frontend/package.json

      - name: Build SHA256 manifest
        run: |
          (cd sbom && sha256sum -- *.json > manifest.sha256)
          sha256sum sbom/manifest.sha256 > sbom/manifest.sha256.sha256

      - name: Sign manifest (ASCII armored)
        if: env.HAS_GPG_KEY == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          echo "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --armor --detach-sign \
            --output sbom/manifest.sha256.asc \
            sbom/manifest.sha256

      - name: Note when signing secrets are missing
        if: env.HAS_GPG_KEY != 'true'
        run: |
          echo "::warning::RELEASE_GPG_PRIVATE_KEY / RELEASE_GPG_PASSPHRASE not configured; manifest generated but not signed."

      - name: Upload release integrity artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-integrity
          path: |
            sbom/backend-cyclonedx.json
            sbom/frontend-cyclonedx.json
            sbom/manifest.sha256
            sbom/manifest.sha256.sha256
            sbom/manifest.sha256.asc
          if-no-files-found: ignore
          retention-days: 30
