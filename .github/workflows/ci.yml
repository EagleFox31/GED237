name: CI

# release/** : the acceptance branch cut at the freeze (release/v1.0.0) runs the same gates as main.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  # Manual full validation: every gate runs.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Stage 0 — Change impact (.github/appfactory-impact.json)
  # ──────────────────────────────────────────────
  # Changed paths → impacted surfaces → required gates. Unknown paths fan out to every gate.
  impact:
    name: Change impact
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@0523510a8e42290df3bae5749d034b1637569af5 # v1.4.0
    with:
      appfactory_ref: 0523510a8e42290df3bae5749d034b1637569af5 # v1.4.0
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  # Push to main only: a merge whose commit has the same tree as the pull request head that
  # already passed "CI Gate" does not re-run the heavy jobs (backend, frontend, e2e). Any doubt
  # runs everything. Gitleaks and the other cheap checks always run. Nothing changes for pull
  # requests. Decision and tests: scripts/ci_reuse_validated_tree.sh, scripts/test_ci_reuse_validated_tree.sh.
  reuse:
    name: Reuse validated tree
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Same tree as a pull request head already validated?
        id: decide
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_reuse_validated_tree.sh

  # ──────────────────────────────────────────────
  # Stage 1 — Backend + Frontend + Security (parallel, gated by impact)
  # ──────────────────────────────────────────────
  backend:
    name: Backend
    needs: [impact, reuse]
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'backend') && needs.reuse.outputs.skip != 'true' }}
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    needs: [impact, reuse]
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'frontend') && needs.reuse.outputs.skip != 'true' }}
    uses: ./.github/workflows/frontend.yml

  # Gitleaks always runs; the other scans follow the gates.
  security:
    name: Security
    needs: impact
    uses: ./.github/workflows/security.yml
    with:
      gates: ${{ needs.impact.outputs.gates }}

  # Critical journeys in a real browser against the real API (docker-compose.e2e.yml, smoke project).
  e2e:
    name: E2E smoke (Playwright)
    needs: [impact, reuse]
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'e2e') && needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner image ships the browsers for one Playwright release: it must follow the lockfile.
      - name: Playwright image matches the lockfile
        run: |
          want=$(jq -r '.packages["node_modules/@playwright/test"].version' frontend/package-lock.json)
          if ! grep -q "mcr.microsoft.com/playwright:v${want}-" docker-compose.e2e.yml; then
            echo "::error file=docker-compose.e2e.yml::Set the e2e image to mcr.microsoft.com/playwright:v${want}-noble (@playwright/test ${want} in frontend/package-lock.json)"
            exit 1
          fi
      - name: Run smoke suite
        run: docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
      - name: API logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200 api
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-report
          path: frontend/e2e-out/
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  # An invalid workflow file fails on every push with zero jobs; catch it in review.
  workflows:
    name: Workflow lint (actionlint)
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'workflow-lint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (same version as .pre-commit-config.yaml)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -no-color -oneline
      # Fake docker, no daemon: backup/restore stop before any write without the helper image,
      # and nginx is restarted then /health checked after api restarts.
      - name: Backup and restore guards
        run: bash scripts/test_ops_backup_guards.sh
      # Same script as the pre-commit hook: a gate name the map never emits would skip its job forever.
      - name: Impact map and workflow gates agree
        run: python3 scripts/check-impact-gates.py
      # Fake docker, no daemon: offline image import on containerd and overlay2 stores.
      - name: Offline images import (both image stores)
        run: bash scripts/test_images_import.sh
      # Fake gh and a throwaway repo, no network: the push-to-main reuse decision (one skip case, every doubt runs all).
      - name: CI reuse decision
        run: bash scripts/test_ci_reuse_validated_tree.sh

  # Same script as the pre-commit hook: no case collisions, UTF-16, NUL, control characters or U+FFFD.
  tracked-files:
    name: Tracked files (case, UTF-8)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files
        run: bash scripts/check-tracked-files.sh

  # The lessons register is frozen (DEC-2026-009): new lessons go in DOCS/engineering/lessons/.
  # Not gated by impact: DOCS/** is ignored by the map, and the register is exactly what is checked.
  lessons-register:
    name: Lessons register frozen
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Guard tests
        run: bash scripts/test_check_lessons_frozen.sh
      # Local push guard of LESSON-2026-075 (run on each workstation; only its tests run here).
      - name: Git push safety tests
        run: bash scripts/test_check_git_safety.sh
      # Pull request: against its base. Push: against the previous tip. Manual run: tests only.
      - name: No new lesson in the frozen register
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No previous commit (new branch): nothing to compare"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          bash scripts/check-lessons-frozen.sh "$BASE_SHA"

  # ──────────────────────────────────────────────
  # Stage 2 — Gate (single required status check)
  # ──────────────────────────────────────────────
  # e2e is deliberately absent from `needs`: non-blocking until 2026-11-21 (RAIDER-D waiver,
  # DEC-2026-002), then add it here to make the smoke suite blocking.
  gate:
    name: CI Gate
    if: always()
    needs: [impact, reuse, backend, frontend, security, workflows, tracked-files, lessons-register]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check pipeline results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          # If the analysis fails, every gated job is skipped and nothing was validated.
          if [[ "$(echo "$NEEDS" | jq -r '.impact.result')" != "success" ]]; then
            echo "::error::Change impact analysis did not succeed"
            exit 1
          fi

          # The reuse decision must have run without error; its answer only matters for the summary.
          if [[ "$(echo "$NEEDS" | jq -r '.reuse.result')" != "success" ]]; then
            echo "::error::Reuse decision did not succeed"
            exit 1
          fi
          if [[ "$(echo "$NEEDS" | jq -r '.reuse.outputs.skip // ""')" == "true" ]]; then
            reason=$(echo "$NEEDS" | jq -r '.reuse.outputs.reason')
            echo "::notice::Backend, frontend and e2e not re-run: $reason"
            {
              echo "### CI reused, not re-run"
              echo "This push to main has the same content as the merged pull request head, whose CI Gate was already green."
              echo "Backend, frontend and e2e were skipped on purpose. Secrets, SAST, workflow lint and file checks ran."
              echo ""
              echo "Reason: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$(echo "$NEEDS" | jq -r '.reuse.outputs.skip // ""')" == "false" ]]; then
            echo "### Full run: $(echo "$NEEDS" | jq -r '.reuse.outputs.reason')" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Skipped means its gate was not required by this change; anything else but success fails.
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [[ -n "$failed" ]]; then
            echo "::error::Jobs did not succeed: $failed"
            exit 1
          fi

          echo "All required pipelines passed"
