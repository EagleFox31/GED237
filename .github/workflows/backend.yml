name: Backend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  PYTHON_VERSION: '3.12'
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_ged
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_ged
  TEST_REDIS_URL: redis://localhost:6379/0
  REDIS_URL: redis://localhost:6379/0

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        # Same pinned version as requirements.txt and .pre-commit-config.yaml.
        run: pip install "$(grep -E '^ruff==' backend/requirements.txt)"

      - name: Ruff check and format
        run: |
          cd backend
          ruff check . --output-format github
          ruff format --check .

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ged
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_ged"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          # CPU-only PyTorch first (same as backend/Dockerfile): the default
          # wheels pull several GB of CUDA libraries that exhaust runner disk
          # and fail to download. Versions come from requirements.txt.
          grep -E '^(torch|torchvision|torchaudio)==' requirements.txt \
            | xargs pip install --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify Alembic migrations
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic check

      - name: AuthZ benchmark gate (CSV vs SQL)
        run: |
          cd backend
          python scripts/benchmark_authz.py \
            --iterations 1000 \
            --sql-p99-max-ms 5 \
            --sql-vs-csv-max-ratio 2.0

      - name: "T6.13: Lint Alembic migrations (squawk)"
        run: |
          npm install -g squawk-cli@1.5.0
          cd backend

          # Generate full migration SQL from base to head
          python -m alembic upgrade base:head --sql > migrations.sql 2>/dev/null || true

          if [ -s migrations.sql ]; then
            echo "=== Linting migration SQL with squawk ==="
            squawk migrations.sql || echo "::warning::squawk found potential migration issues — review above"
          else
            echo "No migration SQL generated — skipping squawk"
          fi

  # The suite runs in 4 parts, balanced by the durations in backend/.test_durations
  # (pytest-split). Each part has its own PostgreSQL and Redis: the conftest empties
  # every table before each test, so two parts cannot share a database.
  # Refresh the durations after large test changes:
  #   python -m pytest tests/ --store-durations
  # A test missing from the file still runs; it is counted at the average duration.
  tests:
    name: Tests (part ${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    # About 4 min of tests plus 1.5 min of setup per part.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ged
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_ged"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          grep -E '^(torch|torchvision|torchaudio)==' requirements.txt \
            | xargs pip install --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests (part ${{ matrix.group }}/4)
        # The 70 % threshold applies to the merged coverage (job "Coverage"), not to a part.
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
        run: |
          cd backend
          python -m pytest tests/ \
            --splits 4 \
            --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            -v \
            --tb=short \
            --timeout=300 \
            --junitxml=test-results-${{ matrix.group }}.xml \
            --cov=app \
            --cov-report= \
            --cov-fail-under=0 \
            -x

      - name: Upload part results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-part-${{ matrix.group }}
          path: |
            backend/test-results-${{ matrix.group }}.xml
            backend/.coverage.${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage (merged)
    needs: tests
    # Also after a failed part: the merged test report shows every failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        # Same coverage.py as the parts (pulled by the pinned pytest-cov).
        run: pip install "$(grep -E '^pytest-cov==' backend/requirements.txt)" junitparser==5.0.3

      - name: Download part results
        uses: actions/download-artifact@v7
        with:
          pattern: backend-part-*
          path: backend
          merge-multiple: true

      - name: Merge test results
        run: |
          cd backend
          junitparser merge test-results-*.xml test-results.xml

      - name: Combine coverage and apply the threshold
        # fail_under (70) comes from backend/.coveragerc.
        if: ${{ needs.tests.result == 'success' }}
        run: |
          cd backend
          python -m coverage combine
          python -m coverage xml -o coverage.xml
          python -m coverage report

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 30
