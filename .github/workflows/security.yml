name: Security Scan

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # T6.7 — SAST Python (Bandit)
  # OWASP A03/A07 — static vulnerability detection
  # ──────────────────────────────────────────────
  bandit:
    name: "SAST: Bandit"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (severity HIGH+)
        run: |
          cd backend
          bandit -r app/ \
            -c .bandit.yml \
            -f json \
            -o bandit-report.json \
            --severity-level high \
            --confidence-level medium \
            || true

      - name: Check for HIGH/CRITICAL findings
        run: |
          cd backend
          # Run again for console output
          bandit -r app/ \
            -c .bandit.yml \
            -ll \
            -ii \
            --severity-level high \
            --confidence-level medium

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # T6.8 — Dependency Audit
  # NIST SSDF / Supply chain — CVE detection
  # ──────────────────────────────────────────────
  dependency-audit:
    name: "SCA: Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: pip install pip-audit

      - name: "Backend: pip-audit"
        run: |
          cd backend
          pip-audit -r requirements.txt \
            --desc \
            --fix --dry-run \
            --output pip-audit-report.json \
            --format json \
            --strict

      - name: "Frontend: npm audit"
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # T6.9 — Secrets Detection (Gitleaks)
  # OWASP A07 — prevent secret leaks
  # ──────────────────────────────────────────────
  gitleaks:
    name: "Secrets: Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ──────────────────────────────────────────────
  # T6.12 — Docker Image Scan (Trivy)
  # Container security — HIGH/CRITICAL detection
  # ──────────────────────────────────────────────
  trivy:
    name: "Container: Trivy"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ged237-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ged237-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ged237-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ged237-frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan docker-compose config
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
