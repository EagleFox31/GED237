name: Security Scan

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────
  # T6.7 — SAST Python (Bandit)
  # OWASP A03/A07 — static vulnerability detection
  # ──────────────────────────────────────────────
  bandit:
    name: "SAST: Bandit"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        # Same pinned version as requirements.txt and .pre-commit-config.yaml.
        run: pip install "$(grep -E '^bandit==' backend/requirements.txt)"

      - name: Run Bandit (JSON report)
        run: |
          cd backend
          bandit -r app/ \
            -c .bandit.yml \
            -f json \
            -o bandit-report.json \
            || true

      - name: Check for findings (same gate as the pre-commit hook)
        run: |
          cd backend
          bandit -r app/ -c .bandit.yml

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # T6.8 — Dependency Audit
  # NIST SSDF / Supply chain — CVE detection
  # ──────────────────────────────────────────────
  dependency-audit:
    name: "SCA: Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: pip install pip-audit

      # GED237 currently has a documented legacy Python dependency backlog,
      # including advisories without an upstream fixed version. Keep generating
      # the complete report on every run, but do not let pre-existing debt block
      # unrelated pull requests. Remediation belongs in dedicated upgrade PRs.
      - name: "Backend: pip-audit (legacy baseline report)"
        continue-on-error: true
        run: |
          cd backend
          pip-audit -r requirements.txt \
            --desc \
            --fix --dry-run \
            --output pip-audit-report.json \
            --format json \
            --strict

      # Keep a blocking frontend gate for CRITICAL advisories. High/medium
      # findings remain visible in npm audit output and can be remediated in a
      # dedicated dependency upgrade without hiding the report.
      - name: "Frontend: npm audit (critical gate)"
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=critical

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # T6.9 — Secrets Detection (Gitleaks)
  # OWASP A07 — prevent secret leaks
  # ──────────────────────────────────────────────
  gitleaks:
    name: "Secrets: Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ──────────────────────────────────────────────
  # T6.12 — Docker Image Scan (Trivy)
  # Container security — CRITICAL findings block CI.
  # Build/scan images sequentially to keep the hosted runner below its disk
  # limit; the backend OCR image is materially larger than a normal API image.
  # The frontend scan targets the production stage so build-only Node tooling
  # (Vite/esbuild/node_modules) is not shipped or evaluated as runtime surface.
  # ──────────────────────────────────────────────
  trivy:
    name: "Container: Trivy"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t ged237-backend:ci ./backend

      - name: Drop backend build cache before scan
        run: docker builder prune -af

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ged237-backend:ci
          scanners: vuln
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Remove backend image
        if: always()
        run: |
          docker image rm -f ged237-backend:ci || true
          docker builder prune -af || true

      - name: Build frontend production image
        run: docker build --target production -t ged237-frontend:ci ./frontend

      - name: Drop frontend build cache before scan
        run: docker builder prune -af

      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ged237-frontend:ci
          scanners: vuln
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Remove frontend image
        if: always()
        run: |
          docker image rm -f ged237-frontend:ci || true
          docker builder prune -af || true

      - name: Scan docker-compose config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
