name: Frontend CI

on:
  workflow_call: {}
  workflow_dispatch: {}

# Node version: single source of truth in frontend/.nvmrc.

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Dockerfile Node version matches .nvmrc
        run: |
          expected="ARG NODE_VERSION=$(tr -d '[:space:]' < frontend/.nvmrc)"
          tr -d '\r' < frontend/Dockerfile | grep -qx "$expected" || {
            echo "::error file=frontend/Dockerfile::Expected '$expected' (from frontend/.nvmrc)"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript type check
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build for production
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30
