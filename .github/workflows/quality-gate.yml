name: Quality Gate

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - 'backend/.bandit.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - 'backend/.bandit.yml'

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  security:
    name: Security Scan
    uses: ./.github/workflows/security.yml
    secrets: inherit

  quality-gate:
    name: Unified Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: always()
    steps:
      - name: Enforce all quality jobs succeeded
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          echo "quality_gate_ok"
