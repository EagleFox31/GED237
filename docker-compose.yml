name: edossier

# Logs capped at 2 x 10 MB per container so a dev stack never fills the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

# Resource caps (hard limits, swap included) keep the stack well inside the Docker VM.
# Override per machine with a docker-compose.override.yml if needed.
services:
  # PostgreSQL Database (internal only)
  postgres:
    image: postgres:15-alpine
    container_name: edossier_postgres
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    shm_size: 128m
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: edossier
      POSTGRES_USER: edossier_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edossier_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edossier_network

  # Redis (internal only)
  redis:
    image: redis:7-alpine
    container_name: edossier_redis
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edossier_network

  # Apply database migrations once PostgreSQL is healthy.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_migrate
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging: *default-logging
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edossier_network
    restart: "no"

  # Demo data, once the schema is at head. The seed converges: reference rows
  # (roles, org unit types) are reconciled by code and the demo tenant is
  # created only when absent, so running it on every `up` is safe.
  # Disable with `docker compose up --scale seed=0` for an empty platform.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_seed
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging: *default-logging
    command: python scripts/seed_db.py
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: development
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edossier_network
    restart: "no"

  # FastAPI Backend (internal only)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_api
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      # python:slim ships no curl; the stdlib is enough to probe /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - storage_data:/var/storage_data
      # Directory import source, read-only: the only tree the API may ingest from.
      - ${INGEST_SOURCE_DIR:-./data/ingest}:/data/ingest:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      STORAGE_PATH: /var/storage_data
      INGEST_ALLOWED_ROOTS: /data/ingest
      ALLOWED_ORIGINS: "http://localhost,http://localhost:8080,http://localhost:80"
      ENVIRONMENT: development
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      DEBUG: "false"
      # Demo room: ~10 logins/OTP in 13 min from one NAT address (parcours-demo.md §0).
      AUTH_LOGIN_RATE_LIMIT: "30/minute"
      AUTH_OTP_RATE_LIMIT: "30/minute"
      # nginx is the only published entry point and sets X-Forwarded-For.
      TRUSTED_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edossier_network

  # Celery Worker (internal only)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_worker
    # OCR (EasyOCR/torch) is the heaviest consumer; one child per CPU granted.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
      - storage_data:/var/storage_data
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PATH: /var/storage_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edossier_network

  # Frontend Vite development target (internal only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: edossier_frontend
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    logging: *default-logging
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - edossier_network

  # Nginx Reverse Proxy (SEUL PORT EXPOSE)
  nginx:
    image: nginx:alpine
    container_name: edossier_nginx
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - edossier_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  edossier_network:
    driver: bridge
