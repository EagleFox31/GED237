version: '3.8'
name: edossier

services:
  # PostgreSQL Database (internal only)
  postgres:
    image: postgres:15-alpine
    container_name: edossier_postgres
    environment:
      POSTGRES_DB: edossier
      POSTGRES_USER: edossier_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edossier_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edossier_network

  # Redis (internal only)
  redis:
    image: redis:7-alpine
    container_name: edossier_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edossier_network

  # Apply database migrations once PostgreSQL is healthy.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edossier_network
    restart: "no"

  # FastAPI Backend (internal only)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - storage_data:/var/storage_data
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      STORAGE_PATH: /var/storage_data
      ALLOWED_ORIGINS: "http://localhost,http://localhost:8080,http://localhost:80"
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edossier_network

  # Celery Worker (internal only)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edossier_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend/app:/app/app
      - storage_data:/var/storage_data
    environment:
      DATABASE_URL: postgresql+asyncpg://edossier_user:${DB_PASSWORD:-changeme}@postgres/edossier
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PATH: /var/storage_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edossier_network

  # Frontend Vite (internal only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edossier_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - edossier_network

  # Nginx Reverse Proxy (SEUL PORT EXPOSE)
  nginx:
    image: nginx:alpine
    container_name: edossier_nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - edossier_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  edossier_network:
    driver: bridge
