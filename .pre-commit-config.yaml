repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        # tsconfig files are JSONC (comments allowed by TypeScript).
        exclude: (^|/)tsconfig[^/]*\.json$
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Tracked files are portable: no case collisions, plain UTF-8 text. Same script as the CI job.
  - repo: local
    hooks:
      - id: tracked-files
        name: tracked files are portable (case, UTF-8)
        entry: scripts/check-tracked-files.sh
        language: script
        pass_filenames: false
      # Impact map and workflows use the same gate names. Same script as the CI job.
      - id: impact-gates
        name: impact map and workflow gates agree
        entry: python scripts/check-impact-gates.py
        language: python
        files: ^\.github/
        pass_filenames: false
      # Every setting of the code reaches the containers (lesson 065). Same script as the CI job.
      - id: config-parity
        name: settings, compose and .env.example agree
        entry: python scripts/check-config-parity.py
        language: python
        files: ^(backend/app/core/config\.py|docker-compose\.yml|\.env\.example|backend/\.env\.example|nginx/|frontend/|scripts/(check-config-parity\.py|config-parity-exceptions\.txt))
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (backend app)
        args: ["-c", "backend/.bandit.yml", "-r", "backend/app"]
        pass_filenames: false

  # Workflow syntax, expression contexts and embedded shell (shellcheck).
  # Runs in Docker: no local Go toolchain needed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
